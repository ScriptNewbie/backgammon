services:
  bgweb-api:
    image: foochu/bgweb-api:latest
    ports:
      - "8080:8080"
    restart: unless-stopped

  dumper:
    build: .
    working_dir: /repo/move-dumper
    volumes:
      - ..:/repo
      - move_dumper_node_modules:/repo/move-dumper/node_modules
    environment:
      BGWEB_BASE_URL: http://bgweb-api:8080
    depends_on:
      - bgweb-api
    profiles: ["dumper"]

  test:
    build: .
    working_dir: /repo/move-dumper
    volumes:
      - ..:/repo
      - move_dumper_node_modules:/repo/move-dumper/node_modules
    command: ["npm", "run", "test:inner"]
    profiles: ["test"]

  install-host:
    build: .
    working_dir: /repo/move-dumper
    volumes:
      - ..:/repo
    entrypoint: ["npm"]
    command: ["install"]
    profiles: ["install-host"]

volumes:
  move_dumper_node_modules:
