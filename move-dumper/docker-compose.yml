services:
  # GNU Backgammon CLI sidecar (ADR 0031). gnubg is installed from Debian inside the
  # image; no GPL code lives in this repo.
  gnubg:
    build: ../docs/integrations/gnubg
    image: backgammon-gnubg
    environment:
      GNUBG_WORKERS: ${GNUBG_WORKERS:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

  dumper:
    build: .
    working_dir: /repo/move-dumper
    volumes:
      - ..:/repo
      - move_dumper_node_modules:/repo/move-dumper/node_modules
    environment:
      GNUBG_BASE_URL: http://gnubg:8080
    depends_on:
      - gnubg
    profiles: ["dumper"]

  test:
    build: .
    working_dir: /repo/move-dumper
    volumes:
      - ..:/repo
      - move_dumper_node_modules:/repo/move-dumper/node_modules
    command: ["npm", "run", "test:inner"]
    profiles: ["test"]

  install-host:
    build: .
    working_dir: /repo/move-dumper
    volumes:
      - ..:/repo
    entrypoint: ["npm"]
    command: ["install"]
    profiles: ["install-host"]

volumes:
  move_dumper_node_modules:
