openapi: 3.1.0
info:
  title: game-engine
  description: |
    Backgammon engine HTTP API (ADR 0032: the engine makes its own decisions). `/evaluate`
    takes a position JSON with dice, runs ONNX cubeless inference on legal checker plays, and
    returns moves best-first for the mover at the match state (mover MWC in a match, negated
    cubeful equity for money); `moves[0]` is the engine's play. `/cube` returns the engine's
    double/take decision for the position with the doubler on roll.

    Domain docs: `docs/domain/game-engine.md`, `docs/domain/board-representation.md`,
    `docs/domain/evaluation.md`.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Docker Compose publish port (`docker compose up` from `game-engine/`)

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                ok: true

  /evaluate:
    post:
      operationId: evaluatePosition
      summary: Evaluate legal checker plays for a position
      description: |
        Request body is a position JSON with `dice` set to two integers 1–6. Returns all
        legal checker plays for the side on roll, each with the eval of the **resulting**
        position (opponent is side to move there). Moves are sorted best-first for the
        mover at the match state: highest mover dead-cube MWC first when `match` is set,
        lowest `cubefulEquity` first (negated result equity) when `match` is null; exact ties
        by `stepsKey`. `moves[0]` is the engine's play. Empty `moves` when the player dances.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
            examples:
              opening31Match:
                summary: Standard opening, p1 on roll with 3-1 (7-point match)
                value:
                  points: [-2, 0, 0, 0, 0, 5, 0, 3, 0, 0, 0, -5, 5, 0, 0, 0, -3, 0, -5, 0, 0, 0, 0, 2]
                  bar: { p1: 0, p2: 0 }
                  off: { p1: 0, p2: 0 }
                  onRoll: p1
                  dice: [3, 1]
                  cube:
                    value: 1
                    owner: centered
                    mayDouble: { p1: true, p2: true }
                  match:
                    length: 7
                    score: { p1: 0, p2: 0 }
                    crawford: false
              opening31Money:
                summary: Money opening, p1 on roll with 3-1 (`match` null)
                value:
                  points: [-2, 0, 0, 0, 0, 5, 0, 3, 0, 0, 0, -5, 5, 0, 0, 0, -3, 0, -5, 0, 0, 0, 0, 2]
                  bar: { p1: 0, p2: 0 }
                  off: { p1: 0, p2: 0 }
                  onRoll: p1
                  dice: [3, 1]
                  cube:
                    value: 1
                    owner: centered
                    mayDouble: { p1: true, p2: true }
                  match: null
      responses:
        "200":
          description: Ranked legal checker plays with evaluations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
              example:
                moves:
                  - steps:
                      - { from: 8, to: 5 }
                      - { from: 6, to: 5 }
                    eval:
                      cubeless:
                        equity: 0.1
                        win: 0.55
                        gammon: 0.1
                        backgammon: 0
                        loseGammon: 0.05
                        loseBackgammon: 0
                      cubefulEquity: 0.1
                      cubeAction: null
                      source: model
        "400":
          description: Invalid JSON, position, or dice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJson:
                  summary: Malformed request body
                  value:
                    error: invalid json
                invalidPosition:
                  summary: Validation failure
                  value:
                    error: dice must be two ints 1-6

  /cube:
    post:
      operationId: cubeDecision
      summary: The engine's cube decision for the doubler on roll
      description: |
        Request body is a position JSON with the doubler on roll and `dice: null` (before the
        roll). The net evaluates the position for the doubler and the dead-cube MWC formula
        (docs/domain/match-play.md) gives the doubler's offer and the taker's answer. Not
        available for money (`match` null), when the player on roll may not double, or at
        cube 64.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              : "#/components/schemas/CubeRequest"
      responses:
        "200":
          description: Cube decision
          content:
            application/json:
              schema:
                : "#/components/schemas/CubeDecision"
              example:
                available: true
                offer: double
                take: take
                noDouble: 0.53
                doubleTake: 0.57
                doubleDrop: 0.56
                cubeless:
                  equity: 0.31
                  win: 0.68
                  gammon: 0.22
                  backgammon: 0.02
                  loseGammon: 0.08
                  loseBackgammon: 0.005
        "400":
          description: Invalid JSON or position, or dice not null
          content:
            application/json:
              schema:
                : "#/components/schemas/ErrorResponse"
              example:
                error: dice must be null (cube decisions are made before the roll)

components:
  schemas:
    HealthResponse:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true

    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string

    Player:
      type: string
      enum: [p1, p2]

    CubeOwner:
      type: string
      enum: [centered, p1, p2]

    CubeValue:
      type: integer
      enum: [1, 2, 4, 8, 16, 32, 64]

    CheckerCounts:
      type: object
      required: [p1, p2]
      additionalProperties: false
      properties:
        p1:
          type: integer
          minimum: 0
          maximum: 15
        p2:
          type: integer
          minimum: 0
          maximum: 15

    Cube:
      type: object
      required: [value, owner, mayDouble]
      additionalProperties: false
      properties:
        value:
          $ref: "#/components/schemas/CubeValue"
        owner:
          $ref: "#/components/schemas/CubeOwner"
        mayDouble:
          type: object
          required: [p1, p2]
          additionalProperties: false
          properties:
            p1:
              type: boolean
            p2:
              type: boolean

    MatchInfo:
      type: object
      required: [length, score, crawford]
      additionalProperties: false
      properties:
        length:
          type: integer
          minimum: 1
          maximum: 15
        score:
          type: object
          required: [p1, p2]
          additionalProperties: false
          properties:
            p1:
              type: integer
              minimum: 0
            p2:
              type: integer
              minimum: 0
        crawford:
          type: boolean

    DicePair:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: integer
        minimum: 1
        maximum: 6

    Points:
      type: array
      minItems: 24
      maxItems: 24
      description: |
        Length 24. Index 0 is point 1. Positive values are p1 checkers; negative values
        are p2 checkers. Checker counts must sum to 15 per player (points + bar + off).
      items:
        type: integer

    Position:
      type: object
      required: [points, bar, off, onRoll, dice, cube, match]
      additionalProperties: false
      properties:
        points:
          $ref: "#/components/schemas/Points"
        bar:
          $ref: "#/components/schemas/CheckerCounts"
        off:
          $ref: "#/components/schemas/CheckerCounts"
        onRoll:
          $ref: "#/components/schemas/Player"
        dice:
          oneOf:
            - $ref: "#/components/schemas/DicePair"
            - type: "null"
          description: Two ints 1–6 when rolled; `null` when not in play.
        cube:
          $ref: "#/components/schemas/Cube"
        match:
          oneOf:
            - $ref: "#/components/schemas/MatchInfo"
            - type: "null"
          description: Live match state, or `null` for money play.

    EvaluateRequest:
      allOf:
        - $ref: "#/components/schemas/Position"
        - type: object
          properties:
            dice:
              $ref: "#/components/schemas/DicePair"
          required: [dice]

    CubeRequest:
      allOf:
        - $ref: "#/components/schemas/Position"
        - type: object
          properties:
            dice:
              type: "null"
          required: [dice]

    CubeDecision:
      type: object
      required: [available, offer, take, noDouble, doubleTake, doubleDrop, cubeless]
      additionalProperties: false
      properties:
        available:
          type: boolean
          description: False for money, when the player on roll may not double, or at cube 64.
        offer:
          type: string
          enum: [double, no-double]
          description: The doubler's action (`no-double` when not available).
        take:
          oneOf:
            - type: string
              enum: [take, drop]
            - type: "null"
          description: The taker's answer to a double; `null` when not available.
        noDouble:
          type: [number, "null"]
          description: Doubler MWC without doubling.
        doubleTake:
          type: [number, "null"]
          description: Doubler MWC after double and take (dead cube at twice the value).
        doubleDrop:
          type: [number, "null"]
          description: Doubler MWC after double and drop.
        cubeless:
          $ref: "#/components/schemas/Cubeless"
          description: The doubler's cubeless probabilities the decision was made from.

    StepFrom:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 24
        - type: string
          enum: [bar]

    StepTo:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 24
        - type: string
          enum: [off]

    Step:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from:
          $ref: "#/components/schemas/StepFrom"
        to:
          $ref: "#/components/schemas/StepTo"

    Cubeless:
      type: object
      required: [equity, win, gammon, backgammon, loseGammon, loseBackgammon]
      additionalProperties: false
      properties:
        equity:
          type: number
          description: Cubeless money equity for side to move (cube = 1).
        win:
          type: number
          minimum: 0
          maximum: 1
          description: P(STM wins), including gammons and backgammons.
        gammon:
          type: number
          minimum: 0
          maximum: 1
          description: P(STM wins a gammon), including backgammons.
        backgammon:
          type: number
          minimum: 0
          maximum: 1
          description: P(STM wins a backgammon).
        loseGammon:
          type: number
          minimum: 0
          maximum: 1
          description: P(STM loses a gammon), including backgammons.
        loseBackgammon:
          type: number
          minimum: 0
          maximum: 1
          description: P(STM loses a backgammon).

    CubeAction:
      type: object
      required: [double, take]
      additionalProperties: false
      properties:
        double:
          type: boolean
          description: Whether STM should double.
        take:
          type: boolean
          description: Whether the opponent should take if STM doubled.

    EvalSource:
      type: string
      enum: [gnubg, bgweb-api, hedgehog, model, heuristic, unknown]

    Eval:
      type: object
      required: [cubeless, cubefulEquity, cubeAction, source]
      additionalProperties: false
      properties:
        cubeless:
          $ref: "#/components/schemas/Cubeless"
        cubefulEquity:
          type: number
          description: |
            Dead-cube money equity for STM: `cubeless.equity * cube.value`. Not match-winning
            chance.
        cubeAction:
          oneOf:
            - $ref: "#/components/schemas/CubeAction"
            - type: "null"
          description: |
            Reserved. Always `null` on engine responses (and on teacher labels); cube decisions
            come from `POST /cube` (ADR 0032).
        source:
          $ref: "#/components/schemas/EvalSource"
          description: Engine responses use `model`.

    ScoredMove:
      type: object
      required: [steps, eval]
      additionalProperties: false
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        eval:
          $ref: "#/components/schemas/Eval"

    EvaluateResponse:
      type: object
      required: [moves]
      additionalProperties: false
      properties:
        moves:
          type: array
          items:
            $ref: "#/components/schemas/ScoredMove"
          description: Legal checker plays sorted best-first for the mover at the match state; `moves[0]` is the engine's play.
