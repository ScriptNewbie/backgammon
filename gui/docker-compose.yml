services:
  gui:
    build: .
    working_dir: /repo/gui
    volumes:
      - ..:/repo
      - gui_node_modules:/repo/gui/node_modules
    ports:
      - "5173:5173"

  test:
    build: .
    working_dir: /repo/gui
    volumes:
      - ..:/repo
      - gui_node_modules:/repo/gui/node_modules
    command: ["npm", "run", "test:inner"]
    profiles: ["test"]

  install-host:
    build: .
    working_dir: /repo/gui
    volumes:
      - ..:/repo
    entrypoint: ["npm"]
    command: ["install"]
    profiles: ["install-host"]

volumes:
  gui_node_modules:
