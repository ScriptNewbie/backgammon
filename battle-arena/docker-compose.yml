services:
  # GNU Backgammon CLI sidecar (ADR 0031). gnubg is installed from Debian inside the
  # image; no GPL code lives in this repo.
  gnubg:
    build: ../docs/integrations/gnubg
    image: backgammon-gnubg
    environment:
      GNUBG_WORKERS: ${GNUBG_WORKERS:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

  game-engine:
    build: ../game-engine
    working_dir: /repo/game-engine
    environment:
      MODEL_PATH: /models/cubeless.onnx
    volumes:
      - ..:/repo
      - game_engine_node_modules:/repo/game-engine/node_modules
      - ../training-ground/checkpoints:/models:ro
    ports:
      - "3000:3000"

  # GPU engine (ADR 0028). Opt-in: `docker compose up -d game-engine-fast`. Shares the build
  # volume with game-engine-fast/ so it does not recompile from scratch.
  game-engine-fast:
    build: ../game-engine-fast
    gpus: all
    working_dir: /repo/game-engine-fast
    environment:
      MODEL_PATH: /models/cubeless-fast.onnx
      PORT: "3001"
      # Tuning (empty = engine default, see docs/domain/game-engine-fast.md).
      SEARCH_MAX_LEAF_VISITS: ${SEARCH_MAX_LEAF_VISITS:-}
      SEARCH_THREADS: ${SEARCH_THREADS:-}
      GPU_SUBBATCH: ${GPU_SUBBATCH:-}
      GPU_LANES: ${GPU_LANES:-}
    volumes:
      - ..:/repo
      - game_engine_fast_build:/build
      - ../training-ground/checkpoints:/models:ro
    ports:
      - "3001:3001"
    profiles: ["fast"]

  arena:
    build: .
    working_dir: /repo/battle-arena
    volumes:
      - ..:/repo
      - battle_arena_node_modules:/repo/battle-arena/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GNUBG_BASE_URL: http://gnubg:8080
      ENGINE_BASE_URL: http://game-engine:3000
      FAST_ENGINE_BASE_URL: http://game-engine-fast:3001
    depends_on:
      - gnubg
      - game-engine
    profiles: ["arena"]

  test:
    build: .
    working_dir: /repo/battle-arena
    volumes:
      - ..:/repo
      - battle_arena_node_modules:/repo/battle-arena/node_modules
    command: ["npm", "run", "test:inner"]
    profiles: ["test"]

  install-host:
    build: .
    working_dir: /repo/battle-arena
    volumes:
      - ..:/repo
    entrypoint: ["npm"]
    command: ["install"]
    profiles: ["install-host"]

volumes:
  battle_arena_node_modules:
  game_engine_node_modules:
  game_engine_fast_build:
    name: game-engine-fast_game_engine_fast_build
