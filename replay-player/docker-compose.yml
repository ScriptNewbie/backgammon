services:
  replay-player:
    build: .
    working_dir: /repo/replay-player
    volumes:
      - ..:/repo
      - replay_player_node_modules:/repo/replay-player/node_modules
    ports:
      - "5173:5173"

  test:
    build: .
    working_dir: /repo/replay-player
    volumes:
      - ..:/repo
      - replay_player_node_modules:/repo/replay-player/node_modules
    command: ["npm", "run", "test:inner"]
    profiles: ["test"]

  install-host:
    build: .
    working_dir: /repo/replay-player
    volumes:
      - ..:/repo
    entrypoint: ["npm"]
    command: ["install"]
    profiles: ["install-host"]

volumes:
  replay_player_node_modules:
